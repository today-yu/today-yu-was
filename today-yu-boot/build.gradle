plugins {
    id 'org.springframework.boot'
}

description = 'today-yu-was'

dependencies {
    implementation project(':today-yu-apis-user')
    implementation project(':today-yu-apis-admin')
    implementation project(':today-yu-apis-common')
    implementation project(':today-yu-application')
    implementation project(':today-yu-domain')
    implementation project(':today-yu-infrastructure')
    implementation project(':today-yu-persistence')
    implementation project(':today-yu-common')

    /* SpringBoot */
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    /* Monitoring: Actuator, Micrometer */
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
}
