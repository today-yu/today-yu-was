<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 영대 비밀번호 초기화</title>
</head>
<body style="margin:0; padding:0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center" style="padding:24px 0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="width:100%; max-width:600px; background-color:#ffffff; border-radius:20px; border-collapse:separate; word-break:keep-all; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">

        <!-- Header -->
        <tr>
          <td style="background-color:#153974; border-radius:20px 20px 0 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
              <tr>
                <td width="50%" valign="top" style="padding:40px 0 36px 40px;">
                  <img src="cid:logo" width="64" height="64" alt="오늘의 영대" style="display:block; border:0;">
                  <p style="margin:26px 0 0; font-size:30px; line-height:36px; font-weight:700; color:#ffffff;">오늘의 영대</p>
                  <p style="margin:11px 0 0; font-size:13px; line-height:16px; font-weight:500; color:#aeb4bf;">
                    영남대 생활을 조금 더 쉽게,<br>하루 한 가지, 꼭 필요한 정보
                  </p>
                </td>
                <td width="50%" valign="bottom" align="right" style="padding:0; border-radius:0 20px 0 0;">
                  <img src="cid:header-decoration" width="300" height="245" alt="" style="display:block; border:0; width:100%; max-width:300px; height:auto;">
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Description -->
        <tr>
          <td style="padding:52px 40px 0;">
            <p style="margin:0; font-size:30px; line-height:36px; font-weight:800; letter-spacing:-1.5px; color:#222222;">오늘의 영대</p>
            <p style="margin:16px 0 0; font-size:18px; line-height:22px; font-weight:700; letter-spacing:-0.9px; color:#757982;">비밀번호 초기화를 위한 인증 번호를 보내드립니다.</p>
            <p style="margin:9px 0 0; font-size:18px; line-height:22px; font-weight:700; letter-spacing:-0.9px; color:#757982;">아래 인증 코드를 앱에 입력해주세요.</p>
          </td>
        </tr>

        <!-- Verification Code -->
        <tr>
          <td style="padding:31px 40px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
              <tr>
                <td align="center" height="128"
                    style="height:128px; padding-left:16px; background-color:#e3eaff; border-radius:12px; font-size:40px; line-height:48px; font-weight:700; letter-spacing:16px; color:#153974;"
                    th:text="${code}">123456</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Notice: PasswordResetVerification Duration -->
        <tr>
          <td style="padding:20px 40px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="width:100%; background-color:#ececec; border-radius:12px;">
              <tr>
                <td width="28" height="84" valign="middle" style="padding:0 19px 0 32px;">
                  <img src="cid:clock" width="28" height="28" alt="" style="display:block; border:0;">
                </td>
                <td valign="middle" style="padding:19px 32px 19px 0; font-size:16px; line-height:23px; font-weight:700; color:#757982;">
                  인증 코드는 발급 후 <span th:text="${durationMinute}">5</span>분 동안만 유효합니다.<br>보안을 위해 타인에게 공유하지 마세요.
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:37px 40px 0;">
            <div style="height:1px; line-height:1px; font-size:0; background-color:#e5e7eb;">&nbsp;</div>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px 40px 30px; font-size:13px; line-height:16px; font-weight:700; color:#aeb4bf;">
            본 메일은 '오늘의 영대' 비밀번호 초기화를 위해 발송된 인증 메일입니다.<br>본인이 요청하지 않은 메일이라면 무시하셔도 됩니다.
            <p style="margin:14px 0 0;">© 2026 오늘의 영대. All rights reserved.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
