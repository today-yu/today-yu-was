# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=1000ms

# Java Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Async
spring.task.execution.thread-name-prefix=async-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=10s

# JWT
jwt.key=${JWT_KEY}
jwt.issuer=${JWT_ISSUER}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# OIDC
oidc.connect-timeout=${OIDC_CONNECT_TIMEOUT:3s}
oidc.read-timeout=${OIDC_READ_TIMEOUT:3s}
oidc.providers.kakao.client-id=${KAKAO_CLIENT_ID}
oidc.providers.kakao.client-secret=${KAKAO_CLIENT_SECRET}
oidc.providers.kakao.redirect-uri=${KAKAO_REDIRECT_URI}
oidc.providers.kakao.token-uri=https://kauth.kakao.com/oauth/token
oidc.providers.kakao.issuer=https://kauth.kakao.com
oidc.providers.kakao.jwk-set-uri=https://kauth.kakao.com/.well-known/jwks.json